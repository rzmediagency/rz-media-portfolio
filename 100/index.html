<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>100days.100Wins.</title>
<meta name="apple-mobile-web-app-title" content="100days.100Wins.">
<link rel="apple-touch-icon" href="/100/apple-touch-icon.png">
<link rel="icon" href="/100/icon-512.png">
<style>
  html,body{margin:0;background:#0c0607;color:#f6ece6;font-family:-apple-system,system-ui,sans-serif}
  main{max-width:440px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left)) 40px;text-align:center}
  img{width:120px;height:120px;border-radius:26px;box-shadow:0 10px 40px rgba(255,90,31,.4)}
  h1{font-size:22px;margin:22px 0 6px}
  ol{text-align:left;line-height:1.7;padding-left:22px}
  button,a.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:1px solid #ff5a1f;background:#ff5a1f;color:#1a0b05;font-weight:700;font-size:16px;text-decoration:none}
  a.btn{background:transparent;color:#f6ece6}
  p{color:#b39a90;font-size:14px}
</style>
</head>
<body>
<main id="setup" hidden>
  <img src="/100/icon-512.png" alt="">
  <h1>Put it on your home screen</h1>
  <ol>
    <li>Tap the <b>Share</b> button in Safari.</li>
    <li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
    <li>Come back here and tap the button below.</li>
  </ol>
  <button id="done">I added it ✓</button>
  <a class="btn" href="https://claude.ai/artifact/HCRpzrc7FLnMr6a1PAsb2z">Open my road now</a>
  <p>After you tap "I added it", the home-screen icon opens your road straight away.</p>
</main>
<script>
  var GO="https://claude.ai/artifact/HCRpzrc7FLnMr6a1PAsb2z", ready=false;
  try{ready=localStorage.getItem("ttf-go")==="1"}catch(e){}
  if(ready && location.search.indexOf("setup")<0){location.replace(GO)}
  else{document.getElementById("setup").hidden=false}
  document.getElementById("done").onclick=function(){try{localStorage.setItem("ttf-go","1")}catch(e){} location.replace(GO)};
</script>
</body>
</html>
